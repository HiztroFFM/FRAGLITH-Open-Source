name: Check standalone Python tools

on:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -s tools/tests -v
